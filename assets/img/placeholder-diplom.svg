<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1017"/>
      <stop offset="50%" stop-color="#0f1523"/>
      <stop offset="100%" stop-color="#080c13"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="560" rx="16" fill="url(#bgGrad)"/>
  <circle cx="400" cy="280" r="260" fill="url(#glowGrad)"/>

  <!-- Outer Tech Frame -->
  <rect x="24" y="24" width="752" height="512" rx="12" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>
  <rect x="36" y="36" width="728" height="488" rx="8" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Corner Tech Accents -->
  <path d="M 24 48 L 48 24" stroke="#00f0ff" stroke-width="2"/>
  <path d="M 776 48 L 752 24" stroke="#00f0ff" stroke-width="2"/>
  <path d="M 24 512 L 48 536" stroke="#00f0ff" stroke-width="2"/>
  <path d="M 776 512 L 752 536" stroke="#00f0ff" stroke-width="2"/>

  <!-- Seal / Emblem -->
  <g transform="translate(400, 140)">
    <circle r="44" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle r="36" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="3 3"/>
    <!-- AI Tech Icon (Neural network nodes) -->
    <circle cx="0" cy="-14" r="5" fill="#00f0ff"/>
    <circle cx="-16" cy="10" r="5" fill="#00f0ff"/>
    <circle cx="16" cy="10" r="5" fill="#00f0ff"/>
    <line x1="0" y1="-14" x2="-16" y2="10" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.7"/>
    <line x1="0" y1="-14" x2="16" y2="10" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.7"/>
    <line x1="-16" y1="10" x2="16" y2="10" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.7"/>
  </g>

  <!-- Title & Text Content -->
  <text x="400" y="225" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" letter-spacing="4" text-anchor="middle" font-weight="600">CERTIFIKÁT &amp; OCENĚNÍ</text>
  
  <text x="400" y="270" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700" text-anchor="middle" letter-spacing="1">DIPLOM Z AI OLYMPIÁDY</text>
  
  <line x1="280" y1="295" x2="520" y2="295" stroke="#334155" stroke-width="1.5"/>
  <circle cx="400" cy="295" r="3" fill="#00f0ff"/>

  <text x="400" y="340" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" text-anchor="middle">Uděleno za úspěšné řešení úloh a algoritmů v celostátní soutěži</text>
  
  <text x="400" y="380" fill="#00f0ff" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="22" font-weight="600" text-anchor="middle">Šimon Tobiáš</text>
  
  <text x="400" y="415" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">Student oboru IT na VOŠKH • Specializace AI, Web &amp; Cybersecurity</text>

  <!-- Instruction hint at bottom -->
  <g transform="translate(400, 480)">
    <rect x="-170" y="-16" width="340" height="32" rx="16" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
    <text x="0" y="5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">Kliknutím zvětšíte / Zobrazit detail</text>
  </g>
</svg>

