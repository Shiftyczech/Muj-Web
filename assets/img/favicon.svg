<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#05070b" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Pozadí se zaoblenými rohy a jemným rámečkem -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="#00f0ff" stroke-width="1.8" stroke-opacity="0.35" />

  <!-- Terminálový prompt >_ -->
  <g filter="url(#cyanGlow)">
    <!-- Chevron > -->
    <path d="M17 21 L29 32 L17 43" fill="none" stroke="#00f0ff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Podtržítko / kurzor _ -->
    <path d="M34 43 L48 43" fill="none" stroke="#00f0ff" stroke-width="5.5" stroke-linecap="round" />
  </g>
</svg>
